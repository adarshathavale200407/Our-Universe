<style>
:root{--ink:#05060f;--gold:#ffd98a;--ice:#cfe0ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--ice);font-family:Caveat,'Segoe Print','Bradley Hand',cursive;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
#sky{position:fixed;inset:0;width:100%;height:100%}
.layer{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2dvh;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;opacity:0;pointer-events:none;transition:opacity .9s;overflow:hidden}
.layer.on{opacity:1;pointer-events:auto}
#flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
.t{font-size:clamp(26px,7.4vw,40px);line-height:1.2;max-width:19em;opacity:0;transition:opacity 1.3s}
.t.s{opacity:1}.big{font-size:clamp(38px,11vw,62px);color:var(--gold);text-shadow:0 0 24px #ffd98a77}
button{font:inherit;font-size:26px;font-weight:700;color:var(--ink);background:var(--gold);border:0;border-radius:999px;padding:.3em 1.4em;box-shadow:0 0 30px #ffd98a88;cursor:pointer;opacity:0;transition:opacity 1s}
button.s{opacity:1}button:not(.s){pointer-events:none}
#scene{background:radial-gradient(circle at 50% 38%,rgba(18,28,74,.5),rgba(5,6,15,.42) 80%)}
#ph{position:relative;width:min(84vw,380px);height:min(50dvh,500px);border-radius:20px;overflow:hidden;box-shadow:0 0 60px #6e8bff55;flex:none}
#ph img{width:100%;height:100%;object-fit:cover;display:block}
#ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px 16px #05060f}
#cap{display:flex;flex-direction:column;gap:.6dvh}
.p{position:absolute;top:-8%;font-size:22px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(115dvh) rotate(360deg)}}
.shoot{position:fixed;z-index:6;top:12%;left:-10%;width:150px;height:3px;background:linear-gradient(90deg,transparent,#fff);animation:sh 1.4s ease-in forwards}
@keyframes sh{from{transform:translate(0,0) rotate(25deg)}to{transform:translate(125vw,58vh) rotate(25deg)}}
#hrt{padding-bottom:20dvh}
#rot{position:fixed;inset:0;z-index:99;background:var(--ink);display:none;align-items:center;justify-content:center;font-size:30px;text-align:center}
@media (orientation:landscape) and (max-height:520px){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){.p{display:none}}
</style></head><body>

<div id="fin" class="layer"><div id="fc"></div><button id="wish">✦ Make a wish</button><button id="again" style="font-size:22px;background:transparent;color:var(--gold);box-shadow:none;border:1px solid #ffd98a88">Watch again</button></div>

const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const ease={io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,in:t=>t*t*t,out:t=>1-Math.pow(1-t,3)};
function tw(o,to,ms,e=ease.io){return new Promise(r=>{const f={};for(const k in to)f[k]=o[k];const t0=performance.now();(function st(n){const p=Math.min(1,(n-t0)/ms),q=e(p);for(const k in to)o[k]=f[k]+(to[k]-f[k])*q;p<1?requestAnimationFrame(st):r()})(t0)})}
/* ---------- sky ---------- */
const cv=$("#sky"),g=cv.getContext("2d");let W,H,D;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
addEventListener("resize",rs);rs();
const cam={z:1,cx:.5,cy:.5,s:0,a:.65,p:0,lab:1,hd:1,dr:0},stars=[];
FS.forEach((f,i)=>stars.push({x:f.x,y:f.y,d:1,r:4,ph:i,f:i,lit:0,blink:0,tx:null,ty:null}));
for(let i=0;i<(innerWidth<500?330:520);i++){const d=.25+.75*Math.random();stars.push({x:Math.random(),y:Math.random(),d,r:.8+Math.random()*1.5,ph:Math.random()*6.3,f:null,tx:null,ty:null})}
function draw(t){
 g.setTransform(D,0,0,D,0,0);g.fillStyle="#05060f";g.fillRect(0,0,W,H);
 const gr=g.createRadialGradient(W/2,H*.4,0,W/2,H*.4,H*.75);gr.addColorStop(0,"rgba(45,58,140,.30)");gr.addColorStop(1,"rgba(5,6,15,0)");g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.font=(W<500?24:28)+"px Caveat,cursive";g.textAlign="center";
 for(const s of stars){
  const ex=s.tx==null?s.x:s.x+(s.tx-s.x)*cam.p,ey=s.tx==null?s.y:s.y+(s.ty-s.y)*cam.p;
  const zd=1+(cam.z-1)*s.d,sx=(ex-cam.cx)*zd*W+W/2+(cam.dr?Math.sin(t/3500)*.03*W*s.d:0),sy=(ey-cam.cy)*zd*H+H/2+(cam.dr?Math.cos(t/4200)*.02*H*s.d:0);
  if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;
  let a=cam.a*cam.hd*(.72+.28*Math.sin(t/700+s.ph)),r=s.r,col="#cfe0ff";
  if(s.f!=null){a=cam.a*(s.lit?1:.85)*(cam.p>0?cam.hd+.25:1);col=s.lit?"#ffd98a":"#e6eeff";r=s.r*(s.lit?1.25:1);
   if(s.blink){const b=Math.max(0,Math.sin(t/170));r*=1+1.3*b;col="#fff3c9"}
   g.shadowColor=s.lit||s.blink?"#ffd98a":"#8fb0ff";g.shadowBlur=s.blink?30:s.lit?18:10}
  else{r*=.8+.7*s.d;if(s.ph%5<1)col="#ffe7b0"}
  if(cam.s){const z2=cam.z*(1-.14*cam.s),zd2=1+(z2-1)*s.d;g.strokeStyle=col;g.globalAlpha=Math.min(1,a);g.lineWidth=r;g.beginPath();g.moveTo(sx,sy);g.lineTo((ex-cam.cx)*zd2*W+W/2,(ey-cam.cy)*zd2*H+H/2);g.stroke()}
  g.globalAlpha=Math.min(1,a);g.fillStyle=col;g.beginPath();g.arc(sx,sy,r,0,6.2832);g.fill();
  if(s.f!=null){g.shadowBlur=0;if(s.lit&&cam.z<1.3&&cam.lab>.01){g.globalAlpha=cam.lab*.9;g.fillStyle="#ffd98a";g.fillText(FS[s.f].k,sx,sy+r+26)}}
  g.globalAlpha=1}
 g.shadowBlur=0}
requestAnimationFrame(function L(t){draw(t);requestAnimationFrame(L)});

let AC,mg,voice;
function audio(){AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();mg=AC.createGain();mg.gain.value=.5;
 const d=AC.createDelay();d.delayTime.value=.38;const fb=AC.createGain(),lp=AC.createBiquadFilter();fb.gain.value=.38;lp.frequency.value=1800;
 mg.connect(AC.destination);mg.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AC.destination);
 const ch=[[220,261.6,329.6],[174.6,220,261.6],[130.8,196,261.6],[196,246.9,293.7]];let n=0;
 setInterval(()=>{if(AC.state!=="running")return;const c=ch[Math.floor(n/6)%4];note(c[[0,1,2,1,2,1][n%6]]*(n%6?1:.5));n++},520);
 if(V){voice=new Audio(V)}}
function note(f,t){t=t||AC.currentTime;const o=AC.createOscillator(),k=AC.createGain();o.type="triangle";o.frequency.value=f;k.gain.setValueAtTime(0,t);k.gain.linearRampToValueAtTime(.22,t+.02);k.gain.exponentialRampToValueAtTime(.001,t+1.8);o.connect(k);k.connect(mg);o.start(t);o.stop(t+1.9)}
const duck=v=>{if(mg)mg.gain.setTargetAtTime(v,AC.currentTime,.25)};
function chime(){if(AC)[1046,1318,1568].forEach((f,i)=>note(f,AC.currentTime+i*.1))}
function thump(t,v){const o=AC.createOscillator(),k=AC.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);k.gain.setValueAtTime(v,t);k.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(k);k.connect(AC.destination);o.start(t);o.stop(t+.25)}
function beats(n){if(AC)for(let i=0;i<n;i++){thump(AC.currentTime+i*.95,.9);thump(AC.currentTime+i*.95+.2,.6)}
 try{navigator.vibrate&&navigator.vibrate(Array(n).fill([70,110,50,720]).flat())}catch(e){}}
